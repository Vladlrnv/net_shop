{% extends 'base.html' %}
{% load my_tags %}
{% block title %}Магазин{% endblock %}
{% block content %}
{% include 'header.html' %}
<div class="container">
    <div class="row text-center">
        {% for product in products %}
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h1 class="my-0 font-weight-normal">{{ product.name }}</h1>
                </div>
                <div class="card-body">
                    <img src='{{ product.image | media_filter }}' class="card-img-top" alt="Изображение">>
                    <h4 class="card-title pricing-card-title">{{ product.price }} рублей</h4>
                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ product.description }}</li>
                    </ul>
                    <a type="button" href='/product_info/{{ product.id }}' class="btn btn-lg btn-block btn-outline-primary">Купить</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
